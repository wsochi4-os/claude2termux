# cloudflared config.yml (edit <TUNNEL_NAME> and <HOSTNAME>)
tunnel: <TUNNEL_ID_OR_NAME>
credentials-file: /root/.cloudflared/<TUNNEL_ID_OR_NAME>.json

ingress:
  - hostname: <HOSTNAME>
    service: http://localhost:8080
  - service: http_status:404

# Optional: metrics and logging
metrics: 127.0.0.1:2000
logfile: /var/log/cloudflared.log
