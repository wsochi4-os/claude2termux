<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2T | Termux Remote</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="cyberpunk">
    <div id="login" class="panel">
        <div class="header">
            <span class="glitch" data-text="AUTH_REQUIRED">AUTH_REQUIRED</span>
        </div>
        <div class="content">
            <input type="password" id="token" placeholder="ENTER ADMIN_TOKEN">
            <button id="save-token">CONNECT</button>
        </div>
    </div>

    <div id="main" style="display:none;">
        <nav class="top-bar">
            <div class="logo">C2T_SYSTEM_v0.2</div>
            <div class="status-group">
                <select id="clients"></select>
                <button id="refresh" class="icon-btn">↻</button>
            </div>
        </nav>

        <div class="terminal-container">
            <div id="output" class="terminal-log">
                <div class="line system">SYSTEM_READY...</div>
                <div class="line">Awaiting command injection.</div>
            </div>
        </div>

        <div class="controls panel">
            <div class="quick-actions">
                <button onclick="quickCmd('ls -la')">LS</button>
                <button onclick="quickCmd('top -n 1')">TOP</button>
                <button onclick="quickCmd('pkg upgrade')">UPGRADE</button>
                <button onclick="quickCmd('termux-vibrate')">VIBE</button>
                <button onclick="clearOutput()" class="danger">CLEAR</button>
            </div>
            <div class="input-area">
                <span class="prompt">λ</span>
                <input type="text" id="cmd" placeholder="Execute command..." autocomplete="off">
                <button id="send">EXEC</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
