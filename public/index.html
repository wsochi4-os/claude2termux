<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>claude2termux — Controller UI</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <div class="container">
    <h1>claude2termux</h1>
    <div id="login" class="card">
      <label>Admin token</label>
      <input id="token" type="password" placeholder="Enter ADMIN_TOKEN" />
      <button id="save-token">Save token</button>
    </div>

    <div id="main" style="display:none">
      <div class="card">
        <label>Client ID</label>
        <select id="clients"></select>
        <button id="refresh">Refresh clients</button>
      </div>

      <div class="card">
        <label>Command</label>
        <textarea id="cmd" rows="3" placeholder="Enter shell command"></textarea>
        <div class="row">
          <button id="send">Send & wait</button>
          <button id="send-no-wait">Send (no-wait)</button>
        </div>
      </div>

      <div class="card">
        <h3>Output</h3>
        <pre id="output"></pre>
      </div>

      <div class="card small">
        <p>Tip: Token is stored in browser localStorage. This UI is for testing; secure it before public use.</p>
      </div>
    </div>
  </div>
  <script src="/ui/app.js"></script>
</body>
</html>
